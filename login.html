<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - FeiraMov</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: #222;

            display: flex;

            justify-content: center;
        }

        .container {

            width: 100%;

            max-width: 420px;

            min-height: 100vh;
        }


        /* HEADER */

        header {

            height: 70px;

            background: #173728;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 15px;
        }

        .voltar {

            border: none;

            background: none;

            color: white;

            font-size: 28px;

            cursor: pointer;
        }

        .logo {

            font-size: 25px;

            font-weight: bold;
        }

        .logo span {
            color: #85c637;
        }

        .header-icons {

            display: flex;

            gap: 12px;

            font-size: 20px;
        }


        /* ÁREA LOGIN */

        .login-area {

            min-height: 595px;

            padding: 45px 20px;

            background:

                linear-gradient(
                    rgba(0,0,0,.4),
                    rgba(0,0,0,.4)
                ),

                url("imagens/login-fundo.jpg");

            background-size: cover;

            background-position: center;

            display: flex;

            flex-direction: column;

            align-items: center;
        }


        .logo-central {

            color: white;

            font-size: 42px;

            font-weight: bold;

            margin-bottom: 30px;
        }

        .logo-central span {
            color: #84c63d;
        }


        .login-area h1 {

            color: #84c63d;

            font-size: 24px;

            margin-bottom: 18px;
        }


        /* CARD LOGIN */

        .login-card {

            width: 100%;

            max-width: 320px;

            background: white;

            border-radius: 18px;

            padding: 25px 16px;
        }

        .campo {
            margin-bottom: 28px;
        }

        .campo label {

            display: block;

            font-size: 13px;

            font-weight: bold;

            color: #444;

            margin-bottom: 7px;
        }

        .campo input {

            width: 100%;

            height: 38px;

            border-radius: 12px;

            border: 1.5px solid #83c63c;

            outline: none;

            padding: 0 12px;

            font-size: 14px;
        }


        .esqueci {

            display: block;

            font-size: 9px;

            color: #75b72e;

            text-decoration: none;

            margin-top: 5px;
        }


        /* GOOGLE */

        .google {

            width: 100%;

            height: 44px;

            border: none;

            border-radius: 12px;

            background: #0d1f13;

            color: white;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 30px;
        }


        /* ENTRAR */

        .entrar {

            display: block;

            width: 75%;

            height: 48px;

            margin: auto;

            border: none;

            border-radius: 12px;

            background: #8bc63f;

            color: white;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;
        }


        /* CRIAR CONTA */

        .criar-conta {

            color: white;

            margin-top: 10px;

            font-size: 12px;
        }

        .criar-conta a {

            color: #8ac73e;

            text-decoration: none;
        }


        /* FOOTER */

        footer {

            background: #173728;

            padding: 32px 20px;

            color: white;

            text-align: center;
        }

        .footer-links {

            display: flex;

            justify-content: space-between;

            margin-bottom: 25px;
        }

        .footer-links a {

            color: white;

            font-size: 9px;

            text-decoration: none;
        }

        footer p {

            color: #7ebe35;

            font-size: 8px;
        }

    </style>

</head>


<body>


<div class="container">


    <header>


        <button
            class="voltar"
            onclick="window.location.href='index.html'">

            ☰

        </button>


        <div class="logo">

            🌿 Feira<span>Mov</span>

        </div>


        <div class="header-icons">

            <span>⌕</span>

            <span>♙</span>

            <span>🛒</span>

            <span>🔔</span>

        </div>


    </header>



    <main class="login-area">


        <div class="logo-central">

            🌿 Feira<span>Mov</span>

        </div>


        <h1>

            Iniciar Sessão

        </h1>



        <form
            class="login-card"
            id="form-login">


            <div class="campo">

                <label for="email">

                    E-Mail ou Username

                </label>

                <input
                    type="text"
                    id="email"
                    required
                >

            </div>



            <div class="campo">

                <label for="senha">

                    Senha

                </label>

                <input
                    type="password"
                    id="senha"
                    required
                >

                <a
                    href="#"
                    class="esqueci">

                    Esqueci minha senha

                </a>

            </div>



            <button
                type="button"
                class="google">

                🌐 Entrar com o Google

            </button>



            <button
                type="submit"
                class="entrar">

                Entrar

            </button>


        </form>



        <p class="criar-conta">

            Não tem uma conta?

            <a href="#">

                Criar conta

            </a>

        </p>


    </main>



    <footer>


        <div class="footer-links">

            <a href="#">
                Suporte e Ajuda
            </a>

            <a href="#">
                Política de Privacidade
            </a>

            <a href="#">
                Fale Conosco
            </a>

        </div>


        <p>

            © FeiraMov, 2026. Todos os direitos reservados.

        </p>


    </footer>


</div>



<script>

    const formulario =
        document.getElementById("form-login");


    formulario.addEventListener(
        "submit",
        function(event) {


            event.preventDefault();


            const email =
                document.getElementById("email").value;

            const senha =
                document.getElementById("senha").value;


            if (
                email !== "" &&
                senha !== ""
            ) {


                alert(
                    "Login realizado com sucesso!"
                );


                window.location.href =
                    "index.html";


            }


        }
    );

</script>


</body>

</html>
