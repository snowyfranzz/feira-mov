<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeiraMov — Criar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_principal.css">
    <link rel="stylesheet" href="style_login.css">
</head>
<body>
<div class="page">
    <header class="topbar">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar-overlay"><img src="IMAGENS PI/menu-svgrepo-com.svg"></button>
        <a href="index.html" class="logo"><img class="logo-icon" src="IMAGENS PI/logo_colorido_texto.svg" alt="FeiraMov"></a>
        <nav class="topbar-nav">
            <a href="index.html">Início</a>
            <a href="perfil-produtor1.html">produtores</a>
            <a href="#">Eventos</a>
            <a href="#">Ajuda</a>
        </nav>
        <div class="topbar-icons">
            <a href="#" aria-label="Buscar" data-abrir-busca aria-expanded="false" aria-controls="busca-overlay"><img src="IMAGENS PI/search-alt-svgrepo-com.svg"></a>
            <a href="login.html" aria-label="Minha conta" class="active"><img src="IMAGENS PI/profile-svgrepo-com.svg"></a>
            <span class="divisor"></span>
            <a href="carrinho.html" aria-label="Carrinho"><img src="IMAGENS PI/cart-large-minimalistic-svgrepo-com.svg"></a>
            <a href="#" aria-label="Notificações"><img src="IMAGENS PI/bell-svgrepo-com.svg"></a>
        </div>
    </header>

    <!-- ======= menu lateral (mobile) ======= -->
    <div class="sidebar-overlay" id="sidebar-overlay">
        <nav class="sidebar" aria-label="Menu principal">
            <div class="sidebar-grupo sidebar-grupo--topo">
                <a href="index.html"><img src="IMAGENS PI/house-svgrepo-com.svg"> Início</a>
                <a href="#" data-abrir-busca><img src="IMAGENS PI/search-alt-svgrepo-com.svg"> Busca</a>
                <a href="#"><img src="IMAGENS PI/shopping-bag-01-svgrepo-com1.svg"> Feiras</a>
                <a href="#"><img src="IMAGENS PI/map-tag-svgrepo-com1.svg"> Eventos</a>
                <a href="perfil-produtor1.html"><img src="IMAGENS PI/users-svgrepo-com.svg"> Produtores</a>
            </div>
            <div class="sidebar-grupo sidebar-grupo--base">
                <a href="#"><img src="IMAGENS PI/bell-svgrepo-com.svg"> Notificações</a>
                <a href="login.html" class="active"><img src="IMAGENS PI/profile-svgrepo-com.svg"> Minha Conta</a>
                <a href="carrinho.html"><img src="IMAGENS PI/cart-large-minimalistic-svgrepo-com.svg"> Meu Carrinho</a>
                <a href="#"><img src="IMAGENS PI/help-svgrepo-com1.svg"> Ajuda</a>
            </div>
        </nav>
    </div>

    <!-- ======= tela de busca (aparece ao clicar na lupa) ======= -->
    <div class="busca-overlay" id="busca-overlay" role="dialog" aria-label="Busca">
        <div class="busca-painel">
            <img class="busca-logo" src="IMAGENS PI/logo_colorido_texto.svg" alt="FeiraMov">

            <div class="busca-barra">
                <button type="button" class="busca-filtros" aria-label="Filtros de busca">
                    <img class="busca-lupa" src="IMAGENS PI/filter-svgrepo-com.svg" alt="">
                </button>
                <form class="busca-form" role="search" onsubmit="return false">
                    <img class="busca-lupa" src="IMAGENS PI/search-alt-svgrepo-com.svg" alt="">
                    <input type="search" id="busca-input" placeholder="Pesquise por feiras, eventos, produtores..." aria-label="Pesquisar">
                    <button type="submit" class="busca-enviar" aria-label="Pesquisar">
                        <img src="IMAGENS PI/arrow-sm-right-svgrepo-com.svg" alt="">
                    </button>
                </form>
            </div>
        </div>
    </div>


    <section class="auth">
        <a href="index.html" class="auth-logo"><img src="IMAGENS PI/logo_colorido_texto.svg" alt="FeiraMov"></a>
        <h1>Criar Conta</h1>
        <div class="auth-card">
            <p class="auth-passo" id="passo">Passo 1 de 2</p>

            <form id="etapa1" onsubmit="return false">
                <div class="campo"><label for="username">Username</label><input id="username" type="text" required></div>
                <div class="campo"><label for="email">E-mail</label><input id="email" type="email" required></div>
                <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" minlength="8" required></div>
                <p class="erro" id="erro-etapa1" role="alert" hidden></p>
                <button type="button" id="continuar" class="btn btn-primario">Continuar</button>
            </form>

            <form id="etapa2" hidden>
                <div class="campo"><label for="nome">Nome completo</label><input id="nome" type="text" required></div>
                <div class="campo"><label for="cpf">CPF</label><input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" required></div>
                <div class="campo"><label for="endereco">Endereço</label><input id="endereco" type="text" required></div>
                <div class="campo"><label for="complemento">Complemento</label><input id="complemento" type="text"></div>
                <label class="switch" for="produtor">
                    <input type="checkbox" id="produtor"><span class="switch-trilho"></span>
                    Conta de produtor?
                </label>
                <div class="campo" id="campo-tenda"><label for="tenda">Nome da tenda</label><input id="tenda" type="text" disabled></div>
                <button type="submit" class="btn btn-primario">Continuar</button>
            </form>
        </div>
        <p class="auth-troca">Já tem uma conta? <a href="login.html">Iniciar Sessão</a></p>
    </section>

    <footer>
        <nav>
            <a href="#">Suporte e Ajuda</a>
            <a href="#">Política de Privacidade</a>
            <a href="#">Fale Conosco</a>
        </nav>
        <p>© FeiraMov, 2026. Todos os direitos reservados.</p>
    </footer>
</div>
<script src="menu.js"></script>
<script src="cadastro.js"></script>

</body>
</html>
